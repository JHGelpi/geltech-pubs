name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs cancel stale runs; deploys on main queue instead of cancelling.
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Share image exists (run `npm run og` after filling site.config.ts)
        run: test -f public/og-default.png
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          SITE_STRICT: '1'
      - run: npm run verify
      - if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # Spec §8: Lighthouse mobile >= 95 in all four categories on home and a sample post.
  # PRs only, so a noisy score never blocks a deploy of already-reviewed code.
  lighthouse:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SHOW_DRAFTS: '1' # the sample post is a draft; this build is never deployed
      - run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true

  # Spec §3/§6: drafts can be reviewed at a preview URL before merging. `versions upload` never
  # touches production; the URL shows as "View deployment" on the PR. Fork PRs get no secrets, so skip them.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SHOW_DRAFTS: '1' # previews show drafts (CLAUDE.md rule 3); this build is never deployed
      - id: upload
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }} --message pr-${{ github.event.pull_request.number }}
      - id: url
        env:
          OUT: ${{ steps.upload.outputs.command-output }}
        run: |
          url=$(grep -oE 'Alias URL: https://\S+' <<<"$OUT" | cut -d' ' -f3 | head -1)
          test -n "$url" || { echo "::error::No preview URL. Preview URLs turn on with the first main deploy that has preview_urls: true, and need a workers.dev subdomain on the account."; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
